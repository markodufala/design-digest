name: Daily design digest

on:
  schedule:
    # GitHub drops scheduled runs at busy times (whole hours especially), so there
    # are backups, plus a Cloudflare cron in worker/ that dispatches with if_missing.
    # The `check` job turns all of them into no-ops once today's digest exists.
    - cron: "17 4 * * *"   # 06:17 Bratislava in summer, 05:17 in winter (GitHub cron is UTC)
    - cron: "47 5 * * *"
    - cron: "31 7 * * *"
  workflow_dispatch:       # "Run workflow" button for manual runs
    inputs:
      if_missing:
        description: "Skip if today's digest already exists (set by the Cloudflare cron)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      done: ${{ steps.today.outputs.done }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # a queued backup run must see the commit an earlier run just pushed
      - id: today
        run: |
          f="data/days/$(TZ=Europe/Bratislava date +%F).json"
          if { [ "${{ github.event_name }}" = schedule ] || [ "${{ inputs.if_missing }}" = true ]; } && [ -f "$f" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"; echo "$f already exists, skipping"
          fi

  digest:
    needs: check
    if: needs.check.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
      FEEDBACK_URL: ${{ vars.FEEDBACK_URL }}
      FEEDBACK_KEY: ${{ secrets.FEEDBACK_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          npm install -g @anthropic-ai/claude-code

      - name: Scrape, curate, build site
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CURATOR_MODEL: ${{ vars.CURATOR_MODEL || 'opus' }}
        run: python -m designdigest --no-email

      - name: Commit archive
        run: |
          git config user.name "design-digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "digest: $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Send email
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python -m designdigest --email-only
