name = "design-digest-feedback"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
SITE_URL = "https://markodufala.github.io/design-digest/"
GITHUB_REPO = "markodufala/design-digest"

# Starts the daily workflow (UTC): 06:20 Bratislava in summer, plus a backup.
[triggers]
crons = ["20 4 * * *", "50 5 * * *"]

# id is filled in after `wrangler kv namespace create VOTES`
[[kv_namespaces]]
binding = "VOTES"
id = "c9b3abb1e78a43cc85451efbaf0a7f40"

# secrets (not in this file):
#   SIGNING_KEY  — must match the FEEDBACK_KEY GitHub secret
#   GITHUB_TOKEN — fine-grained PAT for this repo with Actions: read & write
