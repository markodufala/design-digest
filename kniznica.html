<style>
:root { --bg: #ffffff; --ink: #111111; --muted: #8a8a8a; --line: #ececec; --fill: #f4f4f4; --nav-h: 48px; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e0e0e; --ink: #ededed; --muted: #7a7a7a; --line: #222222; --fill: #1a1a1a; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 "Inter Tight", system-ui, -apple-system, sans-serif; letter-spacing: -.005em;
}
a { color: inherit; text-decoration: none; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 0 16px; }
@media (min-width: 768px) { .wrap { padding: 0 40px; } }

header.top .wrap { display: flex; align-items: center; height: 64px; gap: 20px; font-size: 14px; }
.logo { font-weight: 500; white-space: nowrap; }
.spacer { flex: 1; }
.pager, .nav { display: flex; gap: 20px; color: var(--muted); white-space: nowrap; }
.pager a:hover, .nav a:hover, .nav a[aria-current] { color: var(--ink); }
@media (max-width: 599px) { header.top .wide { display: none; } }

.hero { display: grid; gap: 28px; padding: 64px 0 56px; }
@media (min-width: 900px) {
  .hero { padding: 72px 0 64px; }
  .hero.split { grid-template-columns: minmax(0, 1fr) minmax(0, 380px); align-items: end; gap: 56px; }
  .hero.split h1 { font-size: clamp(40px, 6vw, 88px); }
}
.hero h1 { font-weight: 400; font-size: clamp(40px, 7vw, 88px); line-height: 1; letter-spacing: -.04em; margin: 0; }
.hero p { color: var(--muted); margin: 18px 0 0; }
.theme .kicker { margin: 0 0 8px; font-size: 13px; }
.theme .theme-text { color: var(--ink); margin: 0; font-size: 17px; line-height: 1.45; letter-spacing: -.01em; text-wrap: pretty; }

/* section bar: under the hero, then stuck to the top while scrolling */
.secnav { position: sticky; top: 0; z-index: 20; background: var(--bg); margin: 0 -16px; padding: 0 16px; }
@media (min-width: 768px) { .secnav { margin: 0 -40px; padding: 0 40px; } }
.secnav.stuck { box-shadow: 0 1px 0 var(--line); }
.secnav-in {
  position: relative; display: flex; align-items: center; gap: 22px; height: var(--nav-h); overflow-x: auto;
  scrollbar-width: none; white-space: nowrap; font-size: 14px; color: var(--muted);
}
.secnav-in::-webkit-scrollbar { display: none; }
@media (max-width: 767px) {
  .secnav-in { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); padding-right: 32px; }
}
.secnav a { transition: color .15s; }
.secnav a:hover, .secnav a.on { color: var(--ink); }
.secnav a span { margin-left: 6px; font-variant-numeric: tabular-nums; opacity: .7; }
.secnav .lib { margin-left: auto; }

section.block { padding: 0 0 96px; scroll-margin-top: calc(var(--nav-h) + 8px); }
section.block h2 {
  display: flex; align-items: baseline; gap: 12px; margin: 0 0 24px; padding-top: 16px;
  border-top: 1px solid var(--line); font-size: 15px; font-weight: 500;
}
section.block h2 small { color: var(--muted); font-size: inherit; font-weight: 400; }
section.block h2 .n { margin-left: auto; }
section.block h2 a.n { color: var(--muted); font-weight: 400; }
section.block h2 a.n:hover { color: var(--ink); }
section.saved:not(.open) { padding-bottom: 48px; }
.saved-toggle {
  display: flex; align-items: baseline; gap: 12px; padding: 0; border: 0; background: none;
  font: inherit; color: inherit; cursor: pointer;
}
.saved-toggle small { color: var(--muted); font-size: inherit; font-weight: 400; font-variant-numeric: tabular-nums; }
.saved-toggle .toggle-label { color: var(--muted); font-weight: 400; }
.saved-toggle:hover .toggle-label { color: var(--ink); }
.secnav + section.block, .secnav + .feature { margin-top: 8px; }
.grid { display: grid; gap: 48px 24px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }

.card { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.shot { display: block; aspect-ratio: 4 / 3; border-radius: 6px; overflow: hidden; background: var(--fill); cursor: zoom-in; }
.shot img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; transition: transform .4s ease; }
.card[data-section="retro"] .shot img { object-position: top left; }
.card:hover .shot img { transform: scale(1.015); }
.row { display: flex; gap: 12px; align-items: flex-start; }
.text { flex: 1; min-width: 0; }
.title { font-size: 15px; font-weight: 500; line-height: 1.3; margin: 0; }
.meta { color: var(--muted); font-size: 13px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta a:hover { color: var(--ink); }
.why { color: var(--muted); font-size: 13px; line-height: 1.45; margin: 6px 0 0; }
.dna { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12px; min-width: 0; }
.swatches { display: flex; gap: 3px; flex: none; }
.sw {
  width: 12px; height: 12px; padding: 0; border: 0; border-radius: 3px; cursor: copy;
  box-shadow: inset 0 0 0 1px rgba(127, 127, 127, .25);
}
.sw.copied { outline: 1px solid var(--ink); outline-offset: 1px; }
.fonts { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tech { color: var(--muted); font-size: 12px; margin-top: 4px; }

/* pick of the day: one card across the page */
.feature { padding: 16px 0 96px; scroll-margin-top: calc(var(--nav-h) + 8px); }
.feature h2 { margin: 0 0 20px; font-size: 15px; font-weight: 500; }
.feature h2 small { color: var(--muted); font-weight: 400; margin-left: 12px; font-size: inherit; }
.card.feature-card { display: grid; gap: 20px 40px; }
@media (min-width: 900px) { .card.feature-card { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); align-items: start; } }
.feature-card .shot { border-radius: 8px; }
.feature-card .title { font-size: clamp(22px, 2.4vw, 30px); font-weight: 500; line-height: 1.15; letter-spacing: -.02em; }
.feature-card .meta { font-size: 14px; margin-top: 8px; }
.feature-card .pick-why { color: var(--ink); font-size: 17px; line-height: 1.45; margin: 18px 0 0; text-wrap: pretty; }
.feature-card .why { font-size: 14px; margin-top: 10px; }
.feature-card .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }

.alerts { margin: 24px 0 0; padding: 12px 16px; border: 1px solid var(--ink); border-radius: 6px; font-size: 13px; }
.alerts p { margin: 0; }
.alerts p + p { margin-top: 8px; }

.taste { margin-bottom: 40px; max-width: 640px; }
.taste h3 { display: flex; align-items: baseline; gap: 12px; }
.taste-text { color: var(--ink); font-size: 14px; white-space: pre-line; }
.taste textarea {
  display: block; width: 100%; min-height: 200px; margin: 0 0 10px; padding: 12px; resize: vertical;
  font: inherit; font-size: 14px; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px;
}
.taste textarea:focus { outline: none; border-color: var(--muted); }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  font: inherit; font-size: 13px; color: var(--ink); background: transparent; cursor: pointer;
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.solid:hover { opacity: .85; }
.btn.lg { font-size: 14px; padding: 8px 16px; }
.link-btn { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; }
.link-btn:hover { color: var(--ink); }
.taste .hint { margin: 10px 0 0; }

.votes { display: flex; gap: 2px; margin: -6px -8px 0 0; }
.vote {
  width: 30px; height: 30px; border: 0; border-radius: 50%; background: transparent; color: var(--muted);
  cursor: pointer; display: grid; place-items: center; font: inherit; font-size: 13px;
}
.vote svg { width: 15px; height: 15px; }
.vote:hover { color: var(--ink); }
.vote[aria-pressed="true"] { color: var(--ink); }
@media (hover: hover) {
  .vote { opacity: 0; transition: opacity .15s; }
  .card:hover .vote, .vote:focus-visible, .vote[aria-pressed="true"], .feature-card .vote { opacity: 1; }
}
.card.hidden-vote .shot, .card.hidden-vote .text { opacity: .25; }

.empty { color: var(--muted); }
footer { border-top: 1px solid var(--line); padding: 24px 0 72px; color: var(--muted); font-size: 13px; }
footer h3 { font-size: 13px; font-weight: 500; color: var(--ink); margin: 0 0 10px; }
.days { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 32px; }
.days a:hover, .days a.on { color: var(--ink); }
.health span { margin-right: 16px; white-space: nowrap; }
.health .bad { color: var(--ink); }
[hidden] { display: none !important; }

/* the owner (a device opened from the email, which carries the key) votes and edits the taste;
   everyone else just reads — and can subscribe */
body:not(.owner) .owner-only, body.owner .visitor-only { display: none !important; }
.subscribe { display: flex; flex-wrap: wrap; gap: 8px; max-width: 440px; margin-top: 28px; }
.subscribe input[type=email] {
  flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px;
}
.subscribe input[type=email]:focus { outline: none; border-color: var(--muted); }
.subscribe .btn { padding: 7px 18px; font-size: 15px; background: var(--ink); color: var(--bg); border-color: var(--ink); }
.subscribe .hp { position: absolute; left: -9999px; width: 1px; height: 1px; }
.sub-note { flex-basis: 100%; margin: 4px 0 0 !important; font-size: 13px; }

.chip {
  display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 12px; line-height: 1.4;
  color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px;
  padding: 3px 10px; cursor: pointer; white-space: nowrap;
}
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip small { color: var(--muted); font-size: inherit; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] small { color: inherit; opacity: .6; }

/* quick look */
.ql {
  --side: 380px;
  padding: 0; border: 0; color: var(--ink); background: var(--bg); overflow: hidden;
  width: min(1240px, calc(100vw - 64px)); max-width: none; max-height: none; border-radius: 10px;
  height: min(calc((min(1240px, 100vw - 64px) - var(--side)) * .75), calc(100vh - 64px));
  box-shadow: 0 30px 90px rgba(0, 0, 0, .35);
}
.ql::backdrop { background: rgba(8, 8, 8, .6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.ql[open] { animation: ql-in .22s cubic-bezier(.2, .8, .2, 1); }
@keyframes ql-in { from { opacity: 0; transform: translateY(10px) scale(.985); } }
@media (prefers-reduced-motion: reduce) { .ql[open] { animation: none; } }
.ql-body {
  display: grid; height: 100%;
  grid-template-columns: minmax(0, 1fr) var(--side); grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "shot bar" "shot side";
}
.ql-body:focus { outline: none; }
.ql-shot { grid-area: shot; position: relative; display: block; background: var(--fill); overflow: hidden; min-height: 0; }
.ql-shot img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; transition: opacity .2s; }
.ql-shot img.loading { opacity: 0; }
.ql-shot[data-section="retro"] img { object-position: top left; }
.ql-shot .go {
  position: absolute; right: 14px; bottom: 14px; font-size: 13px; padding: 6px 12px; border-radius: 999px;
  background: rgba(17, 17, 17, .78); color: #fff; opacity: 0; transition: opacity .15s;
}
.ql-shot:hover .go, .ql-shot:focus-visible .go { opacity: 1; }
.ql-bar { grid-area: bar; display: flex; align-items: center; gap: 2px; padding: 12px 12px 0 24px; color: var(--muted); font-size: 13px; }
.ql-pos { font-variant-numeric: tabular-nums; margin-right: auto; }
.ql-ico {
  width: 34px; height: 34px; border: 0; border-radius: 50%; background: transparent; color: var(--ink);
  font: inherit; font-size: 16px; cursor: pointer; display: grid; place-items: center;
}
.ql-ico:hover { background: var(--fill); }
.ql-ico:disabled { color: var(--line); cursor: default; background: none; }
.ql-side { grid-area: side; display: flex; flex-direction: column; gap: 18px; padding: 8px 24px 22px; overflow-y: auto; }
.ql-kicker { margin: 0; color: var(--muted); font-size: 13px; }
.ql-title { margin: -10px 0 0; font-size: 24px; font-weight: 500; line-height: 1.15; letter-spacing: -.02em; overflow-wrap: anywhere; }
.ql-take { margin: 0; font-size: 16px; line-height: 1.45; text-wrap: pretty; }
.ql-why { margin: -8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
.ql-pal { display: flex; gap: 6px; }
.ql-sw {
  flex: 1; min-width: 0; padding: 0; border: 0; background: none; cursor: copy; color: var(--muted);
  font: 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; text-align: left;
}
.ql-sw i { display: block; height: 36px; border-radius: 5px; margin-bottom: 5px; box-shadow: inset 0 0 0 1px rgba(127, 127, 127, .25); }
.ql-sw:hover { color: var(--ink); }
.ql-facts { display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; margin: 0; font-size: 13px; align-items: baseline; }
.ql-facts dt { color: var(--muted); }
.ql-facts dd { margin: 0; display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.ql-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.ql-votes { display: flex; gap: 8px; }
.ql-votes .btn { flex: 1; justify-content: center; padding: 8px 12px; font-size: 14px; }
.ql-votes .btn svg { width: 14px; height: 14px; }
.ql-votes .btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.ql-keys { margin: auto 0 0; padding-top: 6px; color: var(--muted); font-size: 12px; line-height: 1.7; }
.ql-keys kbd { font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-right: 3px; }
@media (hover: none) { .ql-keys { display: none; } }
/* narrower windows: picture on top, text under it, the whole sheet scrolls */
@media (max-width: 1099px) {
  .ql { width: min(760px, calc(100vw - 48px)); height: auto; max-height: calc(100dvh - 48px); }
  .ql-body { display: flex; flex-direction: column; max-height: calc(100dvh - 48px); overflow-y: auto; overscroll-behavior: contain; }
  .ql-body > * { flex: none; }
  .ql-bar { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 8px 8px 8px 20px; }
  .ql-shot { aspect-ratio: 4 / 3; }
  .ql-side { overflow: visible; padding: 18px 20px 24px; }
}
/* phones: a full-screen sheet */
@media (max-width: 819px) {
  .ql { width: 100%; height: 100%; height: 100dvh; max-height: none; border-radius: 0; margin: 0; }
  .ql-body { height: 100%; max-height: none; }
  .ql-bar { padding: max(8px, env(safe-area-inset-top)) 8px 8px 16px; }
  .ql-side { padding: 18px 16px max(28px, env(safe-area-inset-bottom)); }
}

.toast {
  position: fixed; left: 50%; bottom: 28px; z-index: 100; transform: translate(-50%, 12px);
  background: var(--ink); color: var(--bg); font-size: 13px; padding: 8px 16px; border-radius: 999px;
  opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
</style><style>
.lib-hero { padding-bottom: 40px; }
.search { position: relative; }
.search input {
  width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 999px; padding: 12px 52px 12px 20px;
}
.search input:focus { outline: none; border-color: var(--muted); }
.search input::-webkit-search-cancel-button { display: none; }
.search kbd {
  position: absolute; right: 16px; top: 50%; transform: translateY(-50%); pointer-events: none;
  font-family: inherit; font-size: 12px; line-height: 1; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px;
}
@media (hover: none) { .search kbd { display: none; } }

.facets { display: grid; gap: 12px; margin: 0 0 28px; font-size: 13px; }
.facet { display: grid; grid-template-columns: 64px minmax(0, 1fr); align-items: center; gap: 12px; margin: 0; }
.facet dt { color: var(--muted); }
.facet dd { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; }
@media (max-width: 767px) {
  .facet { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .facet dd { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
  .facet dd::-webkit-scrollbar { display: none; }
}
.dot {
  width: 24px; height: 24px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(127, 127, 127, .3); flex: none;
}
.dot[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
.status {
  display: flex; align-items: baseline; gap: 16px; padding: 14px 0 0; margin: 0 0 24px;
  border-top: 1px solid var(--line); color: var(--muted); font-size: 14px;
}
.status b { color: var(--ink); font-weight: 500; }
.more { height: 1px; }
.lib-empty { padding: 48px 0 96px; color: var(--muted); }
.lib-grid { padding-bottom: 96px; }
</style>
</head>

<header class="top">
  <div class="wrap">

    <nav class="pager wide"><a href="index.html">Dnešný výber →</a></nav>
  </div>
</header>

<main class="wrap">

      <h1>Knižnica</h1>

    </label>

<dialog class="ql" id="ql" aria-label="Náhľad">

      <span class="ql-pos" id="ql-pos"></span>
      <button class="ql-ico" id="ql-prev" type="button" aria-label="Predošlé" title="Predošlé (←)">←</button>
      <button class="ql-ico" id="ql-next" type="button" aria-label="Ďalšie" title="Ďalšie (→)">→</button>
      <button class="ql-ico" id="ql-close" type="button" aria-label="Zavrieť" title="Zavrieť (Esc)">✕</button>
    </div>
    <a class="ql-shot" id="ql-shot" target="_blank" rel="noopener"><img alt="" referrerpolicy="no-referrer"><span class="go">Otvoriť web ↗</span></a>
    <div class="ql-side" id="ql-side"></div>
  </div>
</dialog>

<script>
(() => {
  const DD = window.DD = {};
  const store = DD.store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  // the owner key arrives through the email's links (#k=…) and stays on this device
  const hash = new URLSearchParams(location.hash.slice(1));
  DD.goTo = null;
  if (hash.get("k")) {
    store.set("dd-key", hash.get("k"));
    DD.goTo = hash.get("go");
    history.replaceState(null, "", location.pathname + location.search + (DD.goTo ? "#" + DD.goTo : ""));
  }
  const KEY = DD.KEY = store.get("dd-key", "");
  const FEEDBACK = DD.FEEDBACK = "https://design-digest-feedback.newsdesign.workers.dev";
  const PREFIX = "";
  // a list of pairs: tojson would sort an object's keys and lose the section order
  const NAMES = DD.NAMES = Object.fromEntries([["wow", "WOW"], ["web", "Web"], ["visual", "Vizu\u00e1l \u0026 shots"], ["ui", "UI komponenty"], ["type", "Typo"], ["retro", "Retro"]]);
  const MONTHS = ["januára", "februára", "marca", "apríla", "mája", "júna", "júla", "augusta", "septembra", "októbra", "novembra", "decembra"];
  const owner = () => document.body.classList.contains("owner");
  const esc = DD.esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const itemOf = card => { try { return JSON.parse(card.dataset.item); } catch { return null; } };
  const ymd = iso => String(iso || "").split("-").map(Number);
  DD.longDate = iso => { const [y, m, d] = ymd(iso); return d ? `${d}. ${MONTHS[m - 1]} ${y}` : ""; };
  DD.shortDate = iso => { const [, m, d] = ymd(iso); return d ? `${d}. ${m}.` : ""; };

  // the whole archive (site/items.json), newest first — for the saved view and the library
  let archive;
  DD.archive = () => archive ||= fetch(PREFIX + "items.json").then(r => r.json()).catch(() => []);

  // ── ♥ / ✕ votes. With a feedback worker they sync everywhere and tune tomorrow's picks;
  //    without one they just live in this browser.
  let votes = store.get("dd-votes", {});            // {id: {v, at, item?}}
  const listeners = [];
  DD.votes = () => votes;
  DD.onVotes = fn => listeners.push(fn);
  DD.paint = () => document.querySelectorAll(".card[data-id]").forEach(card => {
    const v = votes[card.dataset.id]?.v || 0;
    card.querySelector(".vote.up")?.setAttribute("aria-pressed", String(v === 1));
    card.querySelector(".vote.down")?.setAttribute("aria-pressed", String(v === -1));
    card.classList.toggle("hidden-vote", v === -1);
  });
  const changed = () => { DD.paint(); paintLookVotes(); listeners.forEach(fn => fn(votes)); };
  DD.vote = (it, v) => {
    v = votes[it.id]?.v === v ? 0 : v;              // the same button again = undo
    if (v) votes[it.id] = { v, at: new Date().toISOString(),
                            item: { id: it.id, title: it.title, url: it.url, image: it.image, source: it.source, section: it.section } };
    else delete votes[it.id];
    store.set("dd-votes", votes);
    changed();
    if (FEEDBACK) {
      fetch(FEEDBACK + "/vote", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: it.id, v, k: KEY }),
      }).catch(() => {});
    }
    return v;
  };
  if (FEEDBACK && KEY) {
    // the worker is the source of truth (votes from email or other devices)
    fetch(FEEDBACK + "/votes", { headers: { Authorization: "Bearer " + KEY } }).then(r => r.json()).then(remote => {
      votes = Object.fromEntries(Object.entries(remote).map(([id, x]) => [id, { ...x, item: votes[id]?.item }]));
      store.set("dd-votes", votes);
      changed();
    }).catch(() => {});
  }

  // ── copy + a small confirmation
  const toastEl = Object.assign(document.createElement("div"), { className: "toast" });
  toastEl.setAttribute("role", "status");
  let toastTimer;
  // a modal dialog covers everything else, so the toast goes into the topmost open one
  const layer = () => [...document.querySelectorAll("dialog[open]")].pop() || document.body;
  DD.toast = msg => {
    layer().appendChild(toastEl);
    toastEl.textContent = msg;
    requestAnimationFrame(() => toastEl.classList.add("on"));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("on"), 1600);
  };
  DD.copy = (text, msg) => {
    const fallback = () => {
      const ta = Object.assign(document.createElement("textarea"), { value: text });
      ta.style.cssText = "position:fixed;opacity:0";
      layer().appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); DD.toast(msg); } catch {}
      ta.remove();
    };
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(() => DD.toast(msg), fallback);
    else fallback();
  };

  // ── "copy as prompt": a brief for Claude / v0 to build something in this spirit
  const LEAD = {
    web: t => `Navrhni a nakóduj úvodnú obrazovku webu v duchu „${t}“.`,
    wow: t => `Navrhni a nakóduj experimentálnu úvodnú obrazovku webu v duchu „${t}“.`,
    visual: t => `Navrhni a nakóduj rozhranie inšpirované shotom „${t}“.`,
    ui: t => `Nakóduj UI komponent inšpirovaný „${t}“.`,
    type: t => `Navrhni a nakóduj typografickú kompozíciu (hero alebo plagát) inšpirovanú projektom „${t}“.`,
    retro: t => `Navrhni a nakóduj súčasný web, ktorý si požičia ducha starého webu „${t}“.`,
  };
  DD.prompt = it => {
    const out = [(LEAD[it.section] || LEAD.web)(it.title || "bez názvu"), "", `Referencia: ${it.link || it.url}`];
    if (it.take) out.push(`Čo z neho zobrať: ${it.take}`);
    if (it.why && it.why !== it.take) out.push(`Čím vyniká: ${it.why}`);
    if (it.fonts?.length) out.push(`Písmo: ${it.fonts.join(", ")} (ak nie je dostupné, použi najbližšiu alternatívu z Google Fonts)`);
    if (it.palette?.length) out.push(`Farby (od najpoužívanejšej): ${it.palette.join(", ")}`);
    if (it.tech?.length) out.push(`Technika a pohyb: ${it.tech.join(", ")}`);
    if (it.section === "retro" && /\d{4}/.test(it.note || "")) out.push(`Obdobie: ${it.note}`);
    out.push("",
      "Nekopíruj ho — zober princíp (kompozíciu, typografickú hierarchiu, prácu s farbou a pohybom) a použi ho na vlastný obsah.",
      "Výstup: jeden HTML súbor s inline CSS a JS, responzívny, s premysleným pohybom pri načítaní a scrollovaní, ktorý rešpektuje prefers-reduced-motion.");
    return out.join("\n");
  };
  const copyPrompt = it => DD.copy(DD.prompt(it), "Prompt skopírovaný");

  // ── the card, in JS (mirrors templates/_card.html)
  const HEART = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.6 2.3 4.5 6.2 4.5c2.2 0 3.6 1.2 4.3 2.3h1c.7-1.1 2.1-2.3 4.3-2.3 3.9 0 5.8 4.1 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg>';
  DD.cardHTML = (it, { date = false } = {}) => {
    const meta = [date && it.date ? DD.shortDate(it.date) : "", it.source, it.author].filter(Boolean).map(esc).join(" · ");
    const pal = it.palette?.length ? `<span class="swatches">${it.palette.map(c =>
      `<button class="sw" style="background:${esc(c)}" data-hex="${esc(c)}" title="${esc(c)} · kopírovať" aria-label="Farba ${esc(c)}, kopírovať"></button>`).join("")}</span>` : "";
    const fonts = it.fonts?.length ? `<span class="fonts" title="${esc(it.fonts.join(", "))}">${esc(it.fonts.join(" · "))}</span>` : "";
    return `<article class="card" data-section="${esc(it.section)}" data-id="${esc(it.id)}" data-item="${esc(JSON.stringify(it))}">
  <a class="shot" href="${esc(it.url)}" target="_blank" rel="noopener"><img src="${esc(it.image)}" alt="${esc(it.title)}" loading="lazy" referrerpolicy="no-referrer"></a>
  <div class="row">
    <div class="text">
      <h3 class="title"><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title || "Bez názvu")}</a></h3>
      <div class="meta">${meta}${it.link ? ` · <a href="${esc(it.link)}" target="_blank" rel="noopener">web ↗</a>` : ""}</div>
      ${it.take || it.why ? `<p class="why">${esc(it.take || it.why)}</p>` : ""}
      ${pal || fonts ? `<div class="dna">${pal}${fonts}</div>` : ""}
      ${it.tech?.length ? `<div class="tech">${esc(it.tech.join(" · "))}</div>` : ""}
    </div>
    <div class="votes owner-only">
      <button class="vote up" data-v="1" aria-pressed="false" aria-label="Páči sa mi" title="Viac takého">${HEART}</button>
      <button class="vote down" data-v="-1" aria-pressed="false" aria-label="Nepáči sa mi" title="Už nikdy">✕</button>
    </div>
  </div>
</article>`;
  };

  // ── quick look: the clicked card's group ([data-ql]) is the list to page through
  const ql = document.getElementById("ql"), body = ql.querySelector(".ql-body");
  const shot = document.getElementById("ql-shot"), img = shot.querySelector("img"), side = document.getElementById("ql-side");
  const pos = document.getElementById("ql-pos"), prev = document.getElementById("ql-prev"), next = document.getElementById("ql-next");
  let list = [], idx = 0, afterClose = null;

  function listFor(card) {
    const group = card.closest("[data-ql]");
    if (group?.qlItems) return group.qlItems();
    return [...(group || document).querySelectorAll(".card[data-item]")]
      .filter(c => c.closest("[data-ql]") === group)   // not the cards of a nested group (saved)
      .map(itemOf).filter(Boolean);
  }
  const lookAt = card => {
    const it = itemOf(card);
    if (!it) return;
    const items = listFor(card), i = items.findIndex(x => x.id === it.id);
    DD.look(i < 0 ? [it] : items, Math.max(i, 0));
  };
  DD.look = (items, i) => {
    list = items; idx = i;
    render();
    if (!ql.open) {
      ql.showModal();
      document.documentElement.style.overflow = "hidden";
      // a history entry, so the phone's back gesture closes the look instead of leaving the page
      history.pushState({ ql: 1 }, "", location.pathname + location.search + "#i=" + encodeURIComponent(list[idx].id));
    }
    body.focus({ preventScroll: true });
  };
  const closeLook = then => {
    afterClose = then || null;
    if (history.state?.ql) history.back();
    else closeNow();
  };
  function closeNow() {
    if (ql.open) ql.close();
    document.documentElement.style.overflow = "";
    const fn = afterClose; afterClose = null;
    fn?.();
  }
  window.addEventListener("popstate", () => { if (ql.open && !history.state?.ql) closeNow(); });
  ql.addEventListener("cancel", e => { e.preventDefault(); closeLook(); });     // Esc
  ql.addEventListener("click", e => { if (e.target === ql) closeLook(); });    // the backdrop
  document.getElementById("ql-close").addEventListener("click", () => closeLook());
  const go = d => { const n = idx + d; if (n >= 0 && n < list.length) { idx = n; render(); } };
  prev.addEventListener("click", () => go(-1));
  next.addEventListener("click", () => go(1));

  // #i=<id> opens that item (shared links, reloads)
  DD.openFromHash = items => {
    const m = location.hash.match(/^#i=(.+)$/);
    if (!m) return;
    const id = decodeURIComponent(m[1]);
    history.replaceState(null, "", location.pathname + location.search);
    if (items) {
      const i = items.findIndex(x => x.id === id);
      if (i >= 0) DD.look(items, i);
      return;
    }
    const card = [...document.querySelectorAll(".card[data-id]")].find(c => c.dataset.id === id);
    if (card) lookAt(card);
  };

  const termChip = t => `<a class="chip" href="${PREFIX}taxonomia.html#t-${encodeURIComponent(t.k)}" data-filter="term" data-value="${esc(t.k)}">${esc(t.n)}</a>`;
  const chip = (type, v) => `<a class="chip" href="${PREFIX}kniznica.html?${type}=${encodeURIComponent(v)}" data-filter="${type}" data-value="${esc(v)}">${esc(v)}</a>`;
  function render() {
    const it = list[idx], href = it.link || it.url;
    pos.textContent = list.length > 1 ? `${idx + 1} / ${list.length}` : "";
    prev.disabled = idx === 0;
    next.disabled = idx === list.length - 1;
    shot.href = href;
    shot.dataset.section = it.section || "";
    if (img.getAttribute("src") !== it.image) {
      img.classList.add("loading");
      img.onload = img.onerror = () => img.classList.remove("loading");
      img.src = it.image;
    }
    img.alt = it.title || "";
    if (history.state?.ql) history.replaceState({ ql: 1 }, "", location.pathname + location.search + "#i=" + encodeURIComponent(it.id));

    const facts = [["Písmo", it.fonts, "font"], ["Tech", it.tech, "tech"]]
      .filter(([, v]) => v?.length)
      .map(([label, v, type]) => `<dt>${label}</dt><dd>${v.map(x => chip(type, x)).join("")}</dd>`).join("")
      + (it.terms?.length ? `<dt>Pojmy</dt><dd>${it.terms.map(termChip).join("")}</dd>` : "");
    const kicker = [NAMES[it.section], it.source, it.author, DD.longDate(it.date)].filter(Boolean).map(esc).join(" · ");
    side.innerHTML = `
      <p class="ql-kicker">${kicker}</p>
      <h2 class="ql-title">${esc(it.title || "Bez názvu")}</h2>
      ${it.take ? `<p class="ql-take">${esc(it.take)}</p>` : ""}
      ${it.why && it.why !== it.take ? `<p class="${it.take ? "ql-why" : "ql-take"}">${esc(it.why)}</p>` : ""}
      ${it.palette?.length ? `<div class="ql-pal">${it.palette.map(c =>
        `<button class="ql-sw" type="button" data-hex="${esc(c)}" title="Kopírovať ${esc(c)}"><i style="background:${esc(c)}"></i>${esc(c)}</button>`).join("")}</div>` : ""}
      ${facts ? `<dl class="ql-facts">${facts}</dl>` : ""}
      <div class="ql-actions">
        <a class="btn solid lg" href="${esc(href)}" target="_blank" rel="noopener">Otvoriť web ↗</a>
        ${it.link && it.url !== it.link ? `<a class="btn lg" href="${esc(it.url)}" target="_blank" rel="noopener">V galérii ↗</a>` : ""}
        <button class="btn lg" type="button" data-prompt>Kopírovať prompt</button>
      </div>
      ${owner() ? `<div class="ql-votes">
        <button class="btn" type="button" data-qv="1" aria-pressed="false">${HEART} Páči sa mi</button>
        <button class="btn" type="button" data-qv="-1" aria-pressed="false">✕ Už nikdy</button>
      </div>` : ""}
      <p class="ql-keys"><kbd>←</kbd><kbd>→</kbd> listovať · ${owner() ? "<kbd>L</kbd> ♥ · <kbd>X</kbd> ✕ · " : ""}<kbd>O</kbd> otvoriť · <kbd>P</kbd> prompt · <kbd>Esc</kbd> zavrieť</p>`;
    side.scrollTop = 0;
    body.scrollTop = 0;
    paintLookVotes();
    for (const n of [list[idx - 1], list[idx + 1]]) if (n?.image) new Image().src = n.image;   // instant paging
  }
  function paintLookVotes() {
    if (!ql.open && !list.length) return;
    const v = votes[list[idx]?.id]?.v || 0;
    side.querySelectorAll("[data-qv]").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.qv) === v)));
  }
  side.addEventListener("click", e => {
    const b = e.target.closest("[data-qv]");
    if (b) DD.vote(list[idx], Number(b.dataset.qv));
    if (e.target.closest("[data-prompt]")) copyPrompt(list[idx]);
  });

  // keyboard: ← → page, L / X vote and move on (fast triage), O open, P prompt
  document.addEventListener("keydown", e => {
    if (!ql.open || e.metaKey || e.ctrlKey || e.altKey || e.target.closest?.("input, textarea")) return;
    const k = e.key.toLowerCase(), it = list[idx];
    if (k === "arrowright" || k === "j") go(1);
    else if (k === "arrowleft" || k === "k") go(-1);
    else if (k === "o") window.open(it.link || it.url, "_blank", "noopener");
    else if (k === "p") copyPrompt(it);
    else if (owner() && (k === "l" || k === "x")) {
      if (DD.vote(it, k === "l" ? 1 : -1) && idx < list.length - 1) setTimeout(() => go(1), 220);
    } else return;
    e.preventDefault();
  });

  // swipe left / right on phones
  let touch = null;
  ql.addEventListener("touchstart", e => { const t = e.touches[0]; touch = { x: t.clientX, y: t.clientY }; }, { passive: true });
  ql.addEventListener("touchend", e => {
    if (!touch) return;
    const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
    touch = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6) go(dx < 0 ? 1 : -1);
  }, { passive: true });

  // ── clicks on cards anywhere on the page
  document.addEventListener("click", e => {
    const vote = e.target.closest(".card[data-id] .vote");
    if (vote) { const it = itemOf(vote.closest(".card")); if (it) DD.vote(it, Number(vote.dataset.v)); return; }

    const sw = e.target.closest(".sw, .ql-sw");
    if (sw) {
      DD.copy(sw.dataset.hex, `${sw.dataset.hex} skopírované`);
      sw.classList.add("copied");
      setTimeout(() => sw.classList.remove("copied"), 900);
      return;
    }

    const card = e.target.closest(".card[data-id]");
    if (card && e.target.closest("[data-prompt]")) { const it = itemOf(card); if (it) copyPrompt(it); return; }
    if (card && e.target.closest("[data-look]")) { lookAt(card); return; }
    // the picture opens the quick look; ⌘ / ctrl / middle click still open the site in a new tab
    if (card && e.target.closest(".shot") && !e.metaKey && !e.ctrlKey && !e.shiftKey && !e.altKey && e.button === 0) {
      e.preventDefault();
      lookAt(card);
      return;
    }

    // font / tech chips: the library filters in place, other pages go there
    const f = e.target.closest("a[data-filter]");
    if (f && DD.onFilter && !e.metaKey && !e.ctrlKey) {
      e.preventDefault();
      const apply = () => DD.onFilter(f.dataset.filter, f.dataset.value);
      ql.open ? closeLook(apply) : apply();
    }
  });
})();
</script><script>
(() => {
  const { esc, NAMES } = DD;
  const PAGE = 48;
  const BUCKETS = [
    ["dark", "Tmavé pozadie", "#111111"], ["red", "Červená", "#e5484d"], ["orange", "Oranžová", "#f76b15"],
    ["yellow", "Žltá", "#ffc53d"], ["green", "Zelená", "#30a46c"], ["blue", "Modrá", "#0090ff"],
    ["purple", "Fialová", "#8e4ec6"], ["pink", "Ružová", "#d6409f"],
  ];
  const grid = document.getElementById("grid"), q = document.getElementById("q");
  const params = new URLSearchParams(location.search);
  const state = {
    q: params.get("q") || "", sec: params.get("sec") || "", color: params.get("color") || "",
    font: params.get("font") || "", tech: params.get("tech") || "", term: params.get("term") || "",
    saved: params.get("saved") === "1",
  };
  q.value = state.q;
  let all = [], results = [], shown = 0;
  const meta = new Map();   // id -> {hay, colors}; kept off the items so they stay clean for data-item

  const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  function hsl(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
    if (!m) return [0, 0, 0];
    const n = parseInt(m[1], 16), r = (n >> 16) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, d = max - min;
    if (!d) return [0, 0, l];
    const s = d / (1 - Math.abs(2 * l - 1));
    const h = max === r ? ((g - b) / d + 6) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return [h * 60, s, l];
  }
  function colorsOf(it) {
    const out = new Set(), p = it.palette || [];
    if (p[0] && hsl(p[0])[2] < .18) out.add("dark");          // the most used colour is dark
    for (const c of p) {
      const [h, s, l] = hsl(c);
      if (s < .28 || l < .14 || l > .92) continue;              // greys, near-black, near-white
      out.add(h < 15 || h >= 345 ? "red" : h < 42 ? "orange" : h < 68 ? "yellow" : h < 170 ? "green"
            : h < 255 ? "blue" : h < 290 ? "purple" : "pink");
    }
    return out;
  }

  function match(it, skip) {
    const m = meta.get(it.id);
    if (skip !== "sec" && state.sec && it.section !== state.sec) return false;
    if (skip !== "font" && state.font && !(it.fonts || []).includes(state.font)) return false;
    if (skip !== "tech" && state.tech && !(it.tech || []).includes(state.tech)) return false;
    if (skip !== "color" && state.color && !m.colors.has(state.color)) return false;
    if (skip !== "term" && state.term && !(it.terms || []).some(t => t.k === state.term)) return false;
    if (skip !== "sec" && state.saved && DD.votes()[it.id]?.v !== 1) return false;
    return !state.q || norm(state.q).split(/\s+/).every(w => m.hay.includes(w));
  }

  // chips count what each choice would leave, given the other filters
  function counts(field) {
    const c = new Map();
    for (const it of all) {
      if (!match(it, field === "colors" ? "color" : field === "section" ? "sec" : field.replace(/s$/, ""))) continue;
      const vals = field === "colors" ? meta.get(it.id).colors : field === "section" ? [it.section]
        : field === "terms" ? (it.terms || []).map(t => t.k) : it[field] || [];
      for (const v of vals) c.set(v, (c.get(v) || 0) + 1);
    }
    return c;
  }
  const chip = (type, value, label, n, on) =>
    `<button class="chip" type="button" data-f="${type}" data-v="${esc(value)}" aria-pressed="${on}">${esc(label)}${n != null ? ` <small>${n}</small>` : ""}</button>`;
  const termNames = new Map();   // taxonomy term key -> name
  function topChips(type, field, limit, label = v => v) {
    const c = counts(field);
    let top = [...c].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, limit);
    if (state[type] && !top.some(([v]) => v === state[type])) top.unshift([state[type], c.get(state[type]) || 0]);
    return top.map(([v, n]) => chip(type, v, label(v), n, state[type] === v)).join("") || '<span class="empty">—</span>';
  }
  function paintFacets() {
    const sec = counts("section");
    const votes = DD.votes(), liked = all.filter(it => votes[it.id]?.v === 1).length;
    document.getElementById("f-sec").innerHTML =
      chip("sec", "", "Všetko", null, !state.sec && !state.saved) +
      Object.keys(NAMES).filter(k => sec.get(k)).map(k => chip("sec", k, NAMES[k], sec.get(k), state.sec === k)).join("") +
      (liked ? `<span class="owner-only">${chip("saved", "1", "♥ Uložené", liked, state.saved)}</span>` : "");
    const col = counts("colors");
    document.getElementById("f-color").innerHTML = BUCKETS.filter(([k]) => col.get(k) || state.color === k).map(([k, label, hex]) =>
      `<button class="dot" type="button" data-f="color" data-v="${k}" style="background:${hex}" aria-pressed="${state.color === k}" title="${label} · ${col.get(k) || 0}" aria-label="${label}"></button>`).join("");
    document.getElementById("f-font").innerHTML = topChips("font", "fonts", 12);
    document.getElementById("f-tech").innerHTML = topChips("tech", "tech", 14);
    document.getElementById("facet-term").hidden = !termNames.size;
    if (termNames.size) document.getElementById("f-term").innerHTML = topChips("term", "terms", 14, k => termNames.get(k) || k);
  }

  function apply() {
    results = all.filter(it => match(it));
    shown = 0;
    grid.innerHTML = "";
    more();
    paintFacets();
    const filtered = state.q || state.sec || state.color || state.font || state.tech || state.term || state.saved;
    document.getElementById("count").innerHTML = filtered
      ? `<b>${results.length}</b> z ${all.length}` : `<b>${all.length}</b> vecí`;
    document.getElementById("reset").hidden = !filtered;
    document.getElementById("empty").hidden = results.length > 0;
    const p = new URLSearchParams();
    for (const [k, v] of Object.entries(state)) if (v) p.set(k, v === true ? "1" : v);
    const qs = p.toString();
    history.replaceState(history.state, "", location.pathname + (qs ? "?" + qs : "") + location.hash);
  }
  function more() {
    const next = results.slice(shown, shown + PAGE);
    grid.insertAdjacentHTML("beforeend", next.map(it => DD.cardHTML(it, { date: true })).join(""));
    shown += next.length;
    DD.paint();
  }
  new IntersectionObserver(([e]) => { if (e.isIntersecting && shown < results.length) more(); },
                           { rootMargin: "1200px 0px" }).observe(document.getElementById("more"));
  grid.qlItems = () => results;   // the quick look pages through every result, not just the rendered ones

  document.getElementById("facets").addEventListener("click", e => {
    const b = e.target.closest("[data-f]");
    if (!b) return;
    const { f, v } = b.dataset;
    if (f === "saved") { state.saved = !state.saved; state.sec = ""; }
    else if (f === "sec") { state.sec = state.sec === v ? "" : v; state.saved = false; }
    else state[f] = state[f] === v ? "" : v;
    apply();
  });
  document.getElementById("reset").addEventListener("click", () => {
    Object.assign(state, { q: "", sec: "", color: "", font: "", tech: "", term: "", saved: false });
    q.value = "";
    apply();
  });
  let typing;
  q.addEventListener("input", () => {
    clearTimeout(typing);
    typing = setTimeout(() => { state.q = q.value.trim(); apply(); }, 120);
  });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && !e.target.closest("input, textarea") && !document.getElementById("ql").open) {
      e.preventDefault();
      q.focus();
    } else if (e.key === "Escape" && e.target === q && q.value) {
      q.value = ""; state.q = ""; apply();
    }
  });
  // a font / tech chip in the quick look filters right here
  DD.onFilter = (type, value) => {
    state[type] = value;
    apply();
    document.getElementById("facets").scrollIntoView({ block: "start" });
  };
  DD.onVotes(() => { if (all.length) { paintFacets(); if (state.saved) apply(); } });

  DD.archive().then(items => {
    all = items;
    for (const it of all) {
      meta.set(it.id, {
        colors: colorsOf(it),
        hay: norm([it.title, it.source, it.author, it.take, it.why, it.note, NAMES[it.section],
                   ...(it.fonts || []), ...(it.tech || []), ...(it.terms || []).map(t => t.n)].join(" ")),
      });
      for (const t of it.terms || []) termNames.set(t.k, t.n);
    }
    apply();
    DD.openFromHash(results);
  });
})();
</script>
</body>
